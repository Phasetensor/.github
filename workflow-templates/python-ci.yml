name: Python CI
on:
  push:
    branches: [ $default-branch ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and quality tools
        run: python -m pip install -e . pytest pytest-cov ruff mypy build
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy src
      - name: Tests and coverage
        run: python -m pytest --cov=src --cov-report=term-missing
      - name: Build distributions
        run: python -m build
